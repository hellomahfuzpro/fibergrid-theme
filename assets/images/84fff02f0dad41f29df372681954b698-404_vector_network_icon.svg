<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0040B8"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background decorative grid / tech circles -->
  <circle cx="250" cy="200" r="170" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="250" cy="200" r="120" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.7"/>
  <circle cx="250" cy="200" r="70" fill="#F8FAFC"/>

  <!-- Network Circuit Lines -->
  <path d="M 60 200 L 140 200 L 170 160 L 220 160" stroke="#0066FF" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 440 200 L 360 200 L 330 240 L 280 240" stroke="#0066FF" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <circle cx="60" cy="200" r="4" fill="#0066FF" opacity="0.6"/>
  <circle cx="440" cy="200" r="4" fill="#0066FF" opacity="0.6"/>

  <!-- Server/Network Node Graphic Container -->
  <rect x="145" y="75" width="210" height="250" rx="24" fill="url(#cardGrad)" stroke="#BFDBFE" stroke-width="2" />
  
  <!-- Server Unit 1 -->
  <rect x="165" y="95" width="170" height="42" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <circle cx="185" cy="116" r="4" fill="#10B981"/>
  <circle cx="199" cy="116" r="4" fill="#0066FF"/>
  <circle cx="213" cy="116" r="4" fill="#93C5FD"/>
  <line x1="240" y1="116" x2="315" y2="116" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>

  <!-- Server Unit 2: Error 404 Beacon / Status -->
  <rect x="165" y="147" width="170" height="106" rx="14" fill="url(#primaryGrad)" filter="url(#softGlow)"/>
  
  <!-- 404 Bold Graphic Typography -->
  <text x="250" y="212" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="2">404</text>
  <text x="250" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#93C5FD" letter-spacing="3">ROUTE DISCONNECTED</text>

  <!-- Server Unit 3 -->
  <rect x="165" y="263" width="170" height="42" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <circle cx="185" cy="284" r="4" fill="#EF4444"/>
  <line x1="205" y1="284" x2="280" y2="284" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>
  <rect x="295" y="277" width="22" height="14" rx="4" fill="#FEE2E2"/>
  <path d="M302 284 L310 284" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>

  <!-- Disconnected Fiber Optic Cable Graphic in Foreground -->
  <!-- Left Cable End -->
  <path d="M 80 340 C 130 340, 160 330, 205 315" stroke="#0066FF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="205" cy="315" r="7" fill="#0066FF"/>
  <circle cx="205" cy="315" r="3" fill="#00D2FF"/>
  
  <!-- Right Cable End (Separated/Disconnected) -->
  <path d="M 420 340 C 370 340, 340 330, 295 315" stroke="#0066FF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="295" cy="315" r="7" fill="#0066FF"/>
  <circle cx="295" cy="315" r="3" fill="#00D2FF"/>

  <!-- Disconnect Warning Icon Badge between Cables -->
  <circle cx="250" cy="315" r="16" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <path d="M250 307 L250 317 M250 322 L250 324" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Floating Network Optical Nodes -->
  <g transform="translate(100, 100)">
    <circle cx="10" cy="10" r="18" fill="#FFFFFF" stroke="#0066FF" stroke-width="2"/>
    <path d="M5 10 L15 10 M10 5 L10 15" stroke="#0066FF" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(370, 90)">
    <circle cx="10" cy="10" r="18" fill="#FFFFFF" stroke="#0066FF" stroke-width="2"/>
    <path d="M6 14 L14 6 M10 6 L14 6 L14 10" stroke="#0066FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>