<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5FD"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0047BA"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>

    <linearGradient id="warningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <linearGradient id="wireLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BFDBFE" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Filters / Shadows -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0047BA" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#002D7A" flood-opacity="0.05"/>
    </filter>

    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Container Card -->
  <rect x="40" y="30" width="520" height="440" rx="32" fill="url(#bgLight)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow)"/>

  <!-- Subtle Ambient Circuit Pattern & Telemetry Grid in Background -->
  <g opacity="0.45">
    <circle cx="300" cy="220" r="160" stroke="#DBEAFE" stroke-width="1.2" stroke-dasharray="6 8"/>
    <circle cx="300" cy="220" r="110" stroke="#BFDBFE" stroke-width="1.2"/>
    <line x1="80" y1="220" x2="190" y2="220" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="410" y1="220" x2="520" y2="220" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Central Dynamic Vector Icon: stylized "404" composed of active network nodes & broken/disconnected optical bridge -->
  
  <!-- Left Digit "4": Sleek geometric fiber node & angled trace -->
  <g transform="translate(115, 110)">
    <!-- Base shadow/depth -->
    <path d="M 64 22 L 18 114 H 74 M 74 22 V 158" stroke="#DBEAFE" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Vibrant primary stroke -->
    <path d="M 64 22 L 18 114 H 74 M 74 22 V 158" stroke="url(#primaryGrad)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Node indicator lights along the 4 -->
    <circle cx="64" cy="22" r="6" fill="#38BDF8"/>
    <circle cx="18" cy="114" r="5" fill="#38BDF8"/>
    <circle cx="74" cy="114" r="6.5" fill="#FFFFFF" stroke="#0066FF" stroke-width="3"/>
    <circle cx="74" cy="158" r="6" fill="#0066FF"/>
  </g>

  <!-- Center Digit "0": The Broken Optical Loop / Disconnected Orbit -->
  <!-- Upper arc & Lower arc with a physical "disconnect" gap + missing link icon -->
  <g transform="translate(230, 110)">
    <!-- Outer subtle halo -->
    <ellipse cx="70" cy="90" rx="46" ry="68" stroke="#EFF6FF" stroke-width="20"/>

    <!-- Left side of 0 (Connected & Glowing) -->
    <path d="M 70 22 C 34 22 24 55 24 90 C 24 125 34 158 70 158" stroke="url(#cyanGrad)" stroke-width="15" stroke-linecap="round"/>
    
    <!-- Right side of 0 with deliberate signal severance/gap -->
    <path d="M 70 22 C 96 22 108 42 113 62" stroke="url(#primaryGrad)" stroke-width="15" stroke-linecap="round"/>
    <path d="M 113 118 C 108 138 96 158 70 158" stroke="url(#primaryGrad)" stroke-width="15" stroke-linecap="round"/>

    <!-- Disconnection Gap Elements in the 0: severed wave pulses & spark -->
    <g transform="translate(116, 90)">
      <!-- Pulsing dropped signal beacon -->
      <circle cx="0" cy="0" r="14" fill="#FFE4E6" stroke="#FDA4AF" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="6" fill="url(#warningGrad)" filter="url(#glowPink)"/>
      
      <!-- Subtle disconnection slash -->
      <line x1="-8" y1="-8" x2="8" y2="8" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Center of "0": floating signal radar search pulse -->
    <circle cx="70" cy="90" r="22" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="3 3"/>
    <!-- Unresolved search question / missing node ping -->
    <circle cx="70" cy="90" r="5" fill="#94A3B8"/>
    <line x1="70" y1="80" x2="70" y2="85" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right Digit "4": Symmetrical sleek optical trace node -->
  <g transform="translate(370, 110)">
    <!-- Base shadow/depth -->
    <path d="M 64 22 L 18 114 H 74 M 74 22 V 158" stroke="#DBEAFE" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Vibrant primary stroke -->
    <path d="M 64 22 L 18 114 H 74 M 74 22 V 158" stroke="url(#primaryGrad)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Node indicator lights along the 4 -->
    <circle cx="64" cy="22" r="6" fill="#38BDF8"/>
    <circle cx="18" cy="114" r="5" fill="#38BDF8"/>
    <circle cx="74" cy="114" r="6.5" fill="#FFFFFF" stroke="#0066FF" stroke-width="3"/>
    <circle cx="74" cy="158" r="6" fill="#0066FF"/>
  </g>

  <!-- Below the 404: Disconnected Route Status Badge & Signal Line -->
  <g transform="translate(300, 345)">
    <!-- Connecting fiber that ends in a gap -->
    <path d="M -160 0 H -60" stroke="url(#wireLeft)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 60 0 H 160" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>

    <!-- Left active plug terminal -->
    <circle cx="-60" cy="0" r="5" fill="#0066FF"/>
    <!-- Right lost destination terminal -->
    <circle cx="60" cy="0" r="5" fill="#94A3B8"/>

    <!-- Central Interactive Disconnect Status Pill -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow)"/>
      <!-- Glowing disconnected indicator -->
      <circle cx="-62" cy="0" r="4.5" fill="#E11D48" filter="url(#glowPink)"/>
      <text x="-48" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="11" fill="#1E293B" letter-spacing="1">ROUTE SEVERED</text>
      <!-- Plug/link broken mini vector -->
      <path d="M 52 -4 L 60 4 M 60 -4 L 52 4" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Dynamic subtle telemetry metadata at bottom -->
  <g transform="translate(300, 415)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="600" font-size="11.5" fill="#64748B" letter-spacing="1.2">
      ERR_404 <tspan fill="#0066FF">•</tspan> NEXT_HOP_UNREACHABLE <tspan fill="#0066FF">•</tspan> NULL0
    </text>
  </g>
</svg>